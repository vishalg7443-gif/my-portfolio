<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Chat Demo | Vishal Ghosh</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}main{max-width:760px;margin:0 auto;padding:38px 20px}.back{color:#7dd3fc;text-decoration:none}.tag{display:inline-block;margin-top:22px;padding:7px 10px;border:1px solid #28415f;border-radius:999px;color:#9fb8d6;font-size:.82rem}.card{margin-top:22px;background:#0d1b2d;border:1px solid #20344f;border-radius:20px;overflow:hidden}.bar{padding:12px 16px;border-bottom:1px solid #20344f;color:#9fb8d6}.log{min-height:340px;padding:20px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:78%;padding:12px 14px;border-radius:14px;background:#172943}.me{align-self:flex-end;background:#2855a6}.system{font-size:.85rem;color:#9fb8d6;align-self:center}.composer{display:flex;gap:10px;padding:16px;border-top:1px solid #20344f}.composer input{flex:1;padding:12px 13px;border-radius:12px;border:1px solid #36506f;background:#081521;color:#fff}.composer button{border:0;border-radius:12px;background:#6ee7c7;color:#062019;font-weight:800;padding:0 18px;cursor:pointer}.note{color:#9fb8d6;line-height:1.6}</style></head>
<body><main><a class="back" href="../../../index.html#projects">← Back to portfolio</a><br><span class="tag">Project 1 · Browser Demo</span><h1>AI Chat Experience</h1><p class="note">This recruiter-friendly demo mirrors the interaction pattern of the Flask + AI API project without exposing an API key.</p><section class="card"><div class="bar">Vishal Builds · AI Assistant</div><div id="log" class="log"><div class="system">Try asking about finance, AI, Flask, or what this project demonstrates.</div></div><form id="chat" class="composer"><input id="message" placeholder="Ask the demo something…" autocomplete="off"><button>Send</button></form></section></main>
<script>
const log=document.getElementById('log'),form=document.getElementById('chat'),input=document.getElementById('message');
function add(t,me=false){const d=document.createElement('div');d.className='bubble'+(me?' me':'');d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function reply(q){q=q.toLowerCase();if(q.includes('finance'))return 'Finance is one of the main themes across this portfolio, especially budgeting, investing, and making complex information easier to understand.';if(q.includes('flask'))return 'The original project used Flask routes and a JSON API so a browser message could travel to Python, reach an AI model, and return as a chat bubble.';if(q.includes('ai'))return 'This project was an early end-to-end AI product build: interface, backend request flow, model call, and response handling.';if(q.includes('project'))return 'It demonstrates web routing, front-end interaction, API integration, environment variables, and AI-assisted implementation.';return 'This static version keeps the interaction public and safe. The source folder shows the Flask + Azure OpenAI implementation pattern.'}
form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(!q)return;add(q,true);input.value='';setTimeout(()=>add(reply(q)),300)});
</script></body></html>
