<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP Agent Demo | Vishal Ghosh</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}main{max-width:860px;margin:0 auto;padding:38px 20px}.back{color:#7dd3fc;text-decoration:none}.tag{display:inline-block;margin-top:22px;padding:7px 10px;border:1px solid #28415f;border-radius:999px;color:#9fb8d6;font-size:.82rem}.muted{color:#9fb8d6;line-height:1.6}.card{background:#0d1b2d;border:1px solid #20344f;border-radius:18px;padding:18px;margin-top:18px}.inputrow{display:flex;gap:10px}.inputrow input{flex:1;padding:12px;border-radius:10px;border:1px solid #36506f;background:#081521;color:#fff}.inputrow button{border:0;border-radius:10px;background:#6ee7c7;color:#062019;font-weight:800;padding:0 18px;cursor:pointer}.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px;margin:20px 0}.node{padding:14px;border:1px solid #35516f;border-radius:14px;background:#10233a;text-align:center}.arrow{color:#6ee7c7;font-size:1.4rem}.result{display:grid;gap:12px}.box{padding:14px;border:1px solid #20344f;border-radius:14px;background:#081521}.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#7dd3fc;margin-bottom:6px}code{white-space:pre-wrap;color:#d9e8ff}@media(max-width:680px){.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);text-align:center}.inputrow{flex-direction:column}.inputrow button{padding:12px}}</style></head>
<body><main><a class="back" href="../../../index.html#projects">← Back to portfolio</a><br><span class="tag">Project 3 · Agent Workflow Demo</span><h1>MCP Agent Workflow</h1><p class="muted">Enter a request. The demo selects a tool, builds structured arguments, runs that tool, and combines the result into a response.</p><section class="card"><form id="form" class="inputrow"><input id="q" value="What does my schedule look like today?" placeholder="Try: motivate me about my finance project"><button>Run agent</button></form><div class="flow"><div class="node">User request</div><div class="arrow">→</div><div class="node">Agent router</div><div class="arrow">→</div><div class="node" id="toolnode">Tool</div></div><div class="result"><div class="box"><div class="label">Structured tool call</div><code id="call"></code></div><div class="box"><div class="label">Tool result</div><code id="toolresult"></code></div><div class="box"><div class="label">Final response</div><div id="final"></div></div></div></section></main>
<script>
const form=document.getElementById('form'),q=document.getElementById('q'),toolnode=document.getElementById('toolnode'),call=document.getElementById('call'),toolresult=document.getElementById('toolresult'),final=document.getElementById('final');
function route(text){const t=text.toLowerCase();if(/schedule|calendar|today|tomorrow/.test(t))return['get_schedule',{day:t.includes('tomorrow')?'tomorrow':'today'}];if(/hype|motivat|encourag|energy/.test(t))return['get_hype',{topic:text}];return['greet',{name:'builder'}]}
function run(text){const [tool,args]=route(text);let result;if(tool==='get_schedule')result={day:args.day,events:['9:00 — Deep work','12:30 — Lunch','3:00 — Project build session']};else if(tool==='get_hype')result={message:'Keep shipping — the project is getting stronger every iteration.'};else result={message:'Hey builder! Great to see you.'};toolnode.textContent=tool;call.textContent=JSON.stringify({tool,arguments:args},null,2);toolresult.textContent=JSON.stringify(result,null,2);final.textContent=tool==='get_schedule'?`I checked ${args.day}: ${result.events.join(' · ')}`:result.message}
form.addEventListener('submit',e=>{e.preventDefault();run(q.value.trim()||'hello')});run(q.value);
</script></body></html>
