<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Games Demo | Vishal Ghosh</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}main{max-width:820px;margin:0 auto;padding:38px 20px}.back{color:#7dd3fc;text-decoration:none}.tag{display:inline-block;margin-top:22px;padding:7px 10px;border:1px solid #28415f;border-radius:999px;color:#9fb8d6;font-size:.82rem}.muted{color:#9fb8d6;line-height:1.6}.card{background:#0d1b2d;border:1px solid #20344f;border-radius:18px;padding:20px;margin-top:18px}.game{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{aspect-ratio:1;border:1px solid #35516f;background:#10233a;color:#eaf2ff;border-radius:14px;font-size:2.2rem;font-weight:900;cursor:pointer}.cell:hover{border-color:#6ee7c7}.status{padding:14px;border-radius:14px;background:#081521;border:1px solid #20344f;min-height:70px;line-height:1.5}.actions{display:flex;gap:10px;margin-top:14px}.actions button{border:0;border-radius:10px;background:#6ee7c7;color:#062019;font-weight:800;padding:11px 15px;cursor:pointer}.score{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}.pill{border:1px solid #35516f;border-radius:999px;padding:8px 12px;color:#9fb8d6}@media(max-width:700px){.game{grid-template-columns:1fr}.board{max-width:360px}}</style></head>
<body><main><a class="back" href="../../../index.html#projects">← Back to portfolio</a><br><span class="tag">Project 5 · Playable Demo</span><h1>AI Games: Tic-Tac-Toe</h1><p class="muted">You are X. The computer is O and uses minimax, so it will not intentionally throw the game. Commentary changes with the board state.</p><section class="card"><div class="game"><div class="board" id="board"></div><div><h2>Game status</h2><div id="status" class="status">Your move.</div><div class="actions"><button id="new">New game</button><button id="hint">Get hint</button></div><div class="score"><span class="pill">You: <strong id="sx">0</strong></span><span class="pill">Computer: <strong id="so">0</strong></span><span class="pill">Draws: <strong id="sd">0</strong></span></div></div></div></section></main>
<script>
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let board=Array(9).fill(''),over=false,s={X:0,O:0,draw:0};const el=document.getElementById('board'),status=document.getElementById('status');
function winner(b){for(const [a,c,d] of wins)if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.every(Boolean)?'draw':null}
function minimax(b,max){const w=winner(b);if(w==='O')return 1;if(w==='X')return -1;if(w==='draw')return 0;let vals=[];for(let i=0;i<9;i++)if(!b[i]){b[i]=max?'O':'X';vals.push(minimax(b,!max));b[i]=''}return max?Math.max(...vals):Math.min(...vals)}
function bestMove(mark='O'){let best=mark==='O'?-2:2,moves=[];for(let i=0;i<9;i++)if(!board[i]){board[i]=mark;const score=minimax(board,mark!=='O');board[i]='';if((mark==='O'&&score>best)||(mark==='X'&&score<best)){best=score;moves=[i]}else if(score===best)moves.push(i)}return moves[Math.floor(Math.random()*moves.length)]}
function draw(){el.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=v;b.onclick=()=>play(i);el.appendChild(b)})}
function end(w){if(!w)return false;over=true;s[w]++;document.getElementById('sx').textContent=s.X;document.getElementById('so').textContent=s.O;document.getElementById('sd').textContent=s.draw;status.textContent=w==='X'?'You found the winning line. Nice play.':w==='O'?'The computer closed the board. Run it back.':'Draw — neither side gave up an opening.';return true}
function play(i){if(over||board[i])return;board[i]='X';draw();if(end(winner(board)))return;status.textContent='Computer is thinking…';setTimeout(()=>{const m=bestMove('O');if(m!==undefined)board[m]='O';draw();if(!end(winner(board)))status.textContent='Your move. Think two steps ahead.'},220)}
document.getElementById('new').onclick=()=>{board=Array(9).fill('');over=false;status.textContent='Your move.';draw()};document.getElementById('hint').onclick=()=>{if(over){status.textContent='Start a new game for another hint.';return}const open=[];board.forEach((v,i)=>{if(!v)open.push(i)});if(!open.length)return;let best=2,moves=[];for(const i of open){board[i]='X';const sc=minimax(board,true);board[i]='';if(sc<best){best=sc;moves=[i]}else if(sc===best)moves.push(i)}status.textContent=`Hint: square ${moves[0]+1} keeps your best available outcome.`};draw();
</script></body></html>
