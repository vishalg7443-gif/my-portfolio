<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Dashboard Demo | Vishal Ghosh</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}main{max-width:900px;margin:0 auto;padding:38px 20px}.back{color:#7dd3fc;text-decoration:none}.tag{display:inline-block;margin-top:22px;padding:7px 10px;border:1px solid #28415f;border-radius:999px;color:#9fb8d6;font-size:.82rem}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#0d1b2d;border:1px solid #20344f;border-radius:18px;padding:18px}.controls{margin:24px 0}.controls label{display:grid;gap:6px}.controls input{padding:11px;border-radius:10px;border:1px solid #36506f;background:#081521;color:#fff}.stat{font-size:2rem;font-weight:850}.muted{color:#9fb8d6;line-height:1.6}.bar{height:18px;background:#17314d;border-radius:999px;overflow:hidden;margin-top:14px}.bar span{display:block;height:100%;background:#6ee7c7}.budget{display:grid;gap:10px;margin-top:14px}.budget-row{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center}.mini{height:9px;background:#17314d;border-radius:999px;overflow:hidden}.mini span{display:block;height:100%;background:#7dd3fc}@media(max-width:680px){.grid{grid-template-columns:1fr}.budget-row{grid-template-columns:90px 1fr 60px}}</style></head>
<body><main><a class="back" href="../../../index.html#projects">← Back to portfolio</a><br><span class="tag">Project 2 · Interactive Demo</span><h1>Financial Future Dashboard</h1><p class="muted">Change the monthly contribution or expected annual return to compare starting at 18 versus 28.</p><section class="card controls"><div class="grid"><label>Monthly contribution ($)<input id="monthly" type="number" min="10" step="10" value="100"></label><label>Annual return (%)<input id="rate" type="number" min="0" max="20" step="0.1" value="8"></label></div></section><div class="grid"><section class="card"><h2>Start at 18</h2><div id="v18" class="stat"></div><p class="muted">47 years of monthly contributions</p><div class="bar"><span style="width:100%"></span></div></section><section class="card"><h2>Start at 28</h2><div id="v28" class="stat"></div><p class="muted">37 years of monthly contributions</p><div class="bar"><span id="bar28"></span></div></section></div><section class="card" style="margin-top:16px"><h2>Sample monthly budget</h2><div class="budget" id="budget"></div></section></main>
<script>
const monthly=document.getElementById('monthly'),rate=document.getElementById('rate'),v18=document.getElementById('v18'),v28=document.getElementById('v28'),bar28=document.getElementById('bar28');
function fv(p,r,y){const mr=(r/100)/12,n=y*12;return mr===0?p*n:p*((Math.pow(1+mr,n)-1)/mr)}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n)}
function calc(){const p=Math.max(0,+monthly.value||0),r=Math.max(0,+rate.value||0),a=fv(p,r,47),b=fv(p,r,37);v18.textContent=money(a);v28.textContent=money(b);bar28.style.width=(a?b/a*100:0).toFixed(1)+'%'}monthly.addEventListener('input',calc);rate.addEventListener('input',calc);calc();
const items=[['Savings',200],['Food',150],['Entertainment',100],['Transportation',80],['Clothes',80],['Phone',50],['Other',140]],max=200,b=document.getElementById('budget');items.forEach(([name,val])=>{b.insertAdjacentHTML('beforeend',`<div class="budget-row"><span>${name}</span><div class="mini"><span style="width:${val/max*100}%"></span></div><strong>$${val}</strong></div>`)});
</script></body></html>
