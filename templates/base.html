<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vishal Ghosh — portfolio featuring AI, finance, data, agent, RAG, and product projects.">
    <meta name="author" content="Vishal Ghosh">
    <title>{% block title %}Vishal Ghosh | Portfolio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='resume.css') }}">
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="/#top" aria-label="Vishal Ghosh home">Vishal Ghosh</a>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
            <nav class="site-nav" aria-label="Primary navigation">
                <a href="/#about">About</a>
                <a href="/#skills">Skills</a>
                <a href="/#projects">Projects</a>
                <a href="/#contact">Contact</a>
            </nav>
        </header>

        <main id="top">{% block content %}{% endblock %}</main>

        <footer class="site-footer">
            <div>
                <p class="footer-name">Vishal Ghosh</p>
                <p class="footer-tagline">AI, finance, and product projects.</p>
                <p class="footer-meta">Built with Python, Flask, HTML/CSS, JavaScript, GitHub, and AI-assisted development.</p>
            </div>
            <div class="footer-links" aria-label="Personal links">
                <a href="https://github.com/vishalg7443-gif" target="_blank" rel="noreferrer">GitHub</a>
                <a href="https://www.linkedin.com/in/vishal-gh/" target="_blank" rel="noreferrer">LinkedIn</a>
                <a href="mailto:vishalg7443@gmail.com">vishalg7443@gmail.com</a>
            </div>
        </footer>
    </div>

    <script>
        const toggle = document.querySelector('.menu-toggle');
        const nav = document.querySelector('.site-nav');
        if (toggle && nav) {
            toggle.addEventListener('click', () => {
                const expanded = toggle.getAttribute('aria-expanded') === 'true';
                toggle.setAttribute('aria-expanded', String(!expanded));
                nav.classList.toggle('is-open');
            });
            nav.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => {
                toggle.setAttribute('aria-expanded', 'false');
                nav.classList.remove('is-open');
            }));
        }
    </script>
    <script src="{{ url_for('static', filename='portfolio.js') }}"></script>
</body>
</html>
