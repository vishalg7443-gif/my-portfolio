{% extends 'base.html' %}

{% block title %}Add Entry | Vishal Builds{% endblock %}

{% block content %}
<section class="section entry-shell">
    <div class="section-heading">
        <h2>Add a new project entry</h2>
        <p>Share a project you built, what you learned, and what felt most exciting.</p>
    </div>

    <div class="form-card">
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/add" enctype="multipart/form-data">
            <label for="title">Project title *</label>
            <input type="text" id="title" name="title" placeholder="What did you build?" required>

            <label for="date">Date</label>
            <input type="date" id="date" name="date" value="{{ today }}">

            <label for="summary">What I built *</label>
            <textarea id="summary" name="summary" placeholder="Describe the project or experience in a few sentences" required></textarea>

            <label for="learned">What I learned</label>
            <textarea id="learned" name="learned" placeholder="Share the main lesson or insight"></textarea>

            <label for="coolest">Coolest thing</label>
            <input type="text" id="coolest" name="coolest" placeholder="What felt most exciting or memorable?">

            <label for="screenshot">Project image (optional)</label>
            <input type="file" id="screenshot" name="screenshot" accept="image/*">

            <button type="submit">Save Entry</button>
        </form>
    </div>
</section>
{% endblock %}
